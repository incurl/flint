name: Template cleanup

# The "Use this template" workflow leaves the template specific files
# behind. This workflow removes them from the generated repository so that
# the new project starts clean.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove the template files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the template specific files
        run: |
          rm -f .template-keep
          rm -rf .github/workflows/template-cleanup.yml
          rm -f docs/EXAMPLE_WIKIDATA_ADAPTER.md

      - name: Commit the cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: remove the template specific files"
          git push
